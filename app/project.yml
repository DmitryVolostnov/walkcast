name: WalkCast
options:
  bundleIdPrefix: DmitryVolostnov
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: CYHGQ2574W
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  WalkCast:
    type: application
    platform: iOS
    sources: [WalkCast]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: DmitryVolostnov.WalkCast
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: WalkCast
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: WalkCast/Info.plist
      properties:
        UIBackgroundModes: [audio]
